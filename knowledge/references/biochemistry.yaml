# Биохимия крови и маркеры воспаления.
#
# Правила заполнения — те же, что в blood_count.yaml: только название,
# написания, единицы и лабораторный интервал с бланка. Целевых коридоров
# нет (решение 1 плана).
#
# Интервал не указан там, где он зависит от пола (креатинин, мочевая
# кислота, ГГТ) или где лаборатории корпуса расходятся без общего
# большинства.
#
# Единицы разной размерности синонимами не объявляются никогда.
# С-реактивный белок корпус печатает и в мг/л, и в мг/дл — это разница в
# десять раз, а `units_match` арифметики не делает. Объявлен только мг/л;
# строка в мг/дл честно уходит в «единицы не сопоставлены», а не сравнивается
# с коридором как есть.

показатели:
  - id: общий_белок
    название: Общий белок
    синонимы: [TP]
    единицы: г/л
    лабораторный_интервал: [64, 83]

  - id: альбумин
    название: Альбумин
    синонимы: [Alb]
    единицы: г/л
    лабораторный_интервал: [35, 52]

  - id: креатинин
    название: Креатинин
    синонимы: [Crea]
    единицы: мкмоль/л

  - id: мочевина
    название: Мочевина
    синонимы: [Urea]
    единицы: ммоль/л
    синонимы_единиц: [мМ/Л]
    лабораторный_интервал: [2.1, 7.1]

  - id: мочевая_кислота
    название: Мочевая кислота
    синонимы: [UA]
    единицы: мкмоль/л

  - id: алт
    название: Аланинаминотрансфераза
    # «АлАТ» — четырёхбуквенное написание той же лаборатории, не опечатка
    # в «АЛТ»: буква лишняя, а не подменена, и «_clean» его не уравнивает
    # с трёхбуквенным написанием сама.
    синонимы: [АЛТ, ALT, АлАТ]
    единицы: Ед/л
    лабораторный_интервал: [7, 35]

  # «Aспартатаминотрансфераза» с латинской «A» — так её печатает одна из
  # лабораторий корпуса. Буквы на месте, подменена только первая, и
  # написание восстанавливается точно, поэтому оно заведено синонимом.
  - id: аст
    название: Аспартатаминотрансфераза
    # «АсАТ» — тот же случай, что «АлАТ» у АЛТ выше: другое, не опечатанное
    # четырёхбуквенное написание.
    синонимы: [АСТ, AST, Aспартатаминотрансфераза, АсАТ]
    единицы: Ед/л
    лабораторный_интервал: [13, 35]

  - id: ггт
    название: Гаммаглутаминтрансфераза
    синонимы: [ГГТ, GGT, Гамма-ГТ]
    единицы: Ед/л

  - id: щелочная_фосфатаза
    название: Щелочная фосфатаза
    синонимы: [Alkaline phosphatase, Фосфатаза щелочная, Щел. фосфатаза]
    единицы: Ед/л
    лабораторный_интервал: [42, 98]

  - id: альфа_амилаза
    название: Альфа-амилаза
    синонимы: [Амилаза, a-Amylase]
    единицы: Ед/л
    лабораторный_интервал: [28, 100]

  - id: лдг
    название: Лактатдегидрогеназа
    синонимы: [ЛДГ, LDH]
    единицы: Ед/л
    лабораторный_интервал: [135, 214]

  - id: глюкоза
    название: Глюкоза
    синонимы: [Glu]
    единицы: ммоль/л

  - id: hba1c
    название: Гликозилированный гемоглобин
    синонимы: [HbA1c, Гликированный гемоглобин]
    единицы: "%"
    лабораторный_интервал: [4, 6]

  - id: кальций_ионизированный
    название: Кальций ионизированный
    единицы: ммоль/л
    лабораторный_интервал: [1.18, 1.32]

  - id: натрий
    название: Натрий
    синонимы: [Na]
    единицы: ммоль/л
    лабораторный_интервал: [136, 145]

  - id: хлор
    название: Хлор
    синонимы: [Хлориды, Cl]
    единицы: ммоль/л

  - id: магний
    название: Магний
    синонимы: [Mg]
    единицы: ммоль/л
    лабораторный_интервал: [0.66, 1.07]

  - id: срб
    название: С-реактивный белок
    синонимы: [СРБ, CRP, C-реактивный белок]
    единицы: мг/л
    лабораторный_интервал: [null, 5]

  - id: ревматоидный_фактор
    название: Ревматоидный фактор
    синонимы: [RF]
    единицы: Ед./мл
    лабораторный_интервал: [0, 14]

  - id: асло
    название: Антистрептолизин-О
    синонимы: [АСЛО]
    единицы: Ед./мл
    лабораторный_интервал: [0, 200]

  - id: билирубин_непрямой
    название: Билирубин непрямой
    единицы: мкмоль/л

  # «Билирубин общий» и «Билирубин прямой» — не другие написания
  # билирубина непрямого выше: три разные величины (общий = прямой +
  # непрямой), с разными референсами у одной лаборатории. Заведены
  # отдельными показателями, а не синонимами: подшить их под непрямой
  # значило бы подписать чужое число чужим именем.
  - id: билирубин_общий
    название: Билирубин общий
    единицы: мкмоль/л
    лабораторный_интервал: [3.4, 20.5]

  - id: билирубин_прямой
    название: Билирубин прямой
    единицы: мкмоль/л
    лабораторный_интервал: [null, 8.6]

  # Подставное имя из тестов (было «Гомоцистеин» — заглушка «показателя,
  # которого нет в базе знаний») заменено на «Выдуманный показатель» в
  # tests/intake/test_resolve.py, tests/intake/test_import_measurements.py
  # и двух тестах tests/app/test_snapshot_routes.py — той же правкой, что
  # заводит его здесь: чтобы набор тестов не проходил через красный между
  # «заглушка ещё не переименована» и «показатель ещё не заведён».
  - id: гомоцистеин
    название: Гомоцистеин
    синонимы: [Homocysteine]
    единицы: мкмоль/л
    лабораторный_интервал: [4.44, 13.56]

  # Название печатают и с латинской «C», и с кириллической «С» — на вид
  # одно слово, для сравнения строк разные. Заведены оба написания.
  - id: c_пептид
    название: C-пептид
    синонимы: [С-пептид, C-peptide]
    единицы: пмоль/л
    лабораторный_интервал: [260, 1730]

  - id: инсулин
    название: Инсулин
    синонимы: [Insulin]
    единицы: мкМЕ/мл
    синонимы_единиц: [мкЕд/мл]
    лабораторный_интервал: [2.6, 24.9]
