# Витамины.
#
# Целевых коридоров нет (решение 1 плана). Для витаминов это существеннее
# всего: лабораторная норма В12 начинается там, где превентивный специалист
# уже видит дефицит, и подставить сюда своё число значило бы подменить её
# суждение.
#
# «Витамин В12» с кириллической «В» и «Витамин B12» с латинской «B» — два
# разных написания для сравнения строк, заведены оба.
#
# Активный В12 (холотранскобаламин) отдельным показателем не заведён:
# _clean срезает всё после первой запятой, и «Витамин В12, активный
# (холотранскобаламин)» превращается в то же самое написание, что и обычный
# В12. Завести его вторым показателем значило бы сделать оба неоднозначными.
# Он приходит в пмоль/л и потому останавливается на сверке единиц, а не
# сравнивается с чужим интервалом.

показатели:
  - id: витамин_b12
    название: Витамин B12
    синонимы: [Витамин В12, Цианокобаламин, B12]
    единицы: пг/мл
    лабораторный_интервал: [187, 883]

  - id: фолиевая_кислота
    название: Фолиевая кислота
    синонимы: [Folic acid, Фолаты]
    единицы: нг/мл
    лабораторный_интервал: [3.1, 17.5]
