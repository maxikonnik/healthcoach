# Обмен железа.
#
# Ферритин заведён отдельно (ferritin.yaml) и целевые коридоры там —
# коуча. Здесь его спутники, у которых коридоров нет (решение 1 плана).
#
# У сывороточного железа интервал не указан: лаборатории корпуса печатают
# 9,0–30,4 и 5,8–34,5 — расхождение шире, чем округление, а среднего из
# них не печатал никто.

показатели:
  - id: железо
    название: Железо
    синонимы: [Fe, Сывороточное железо]
    единицы: мкмоль/л

  - id: трансферрин
    название: Трансферрин
    синонимы: [Transferrin]
    единицы: г/л
    лабораторный_интервал: [2.5, 3.8]

  - id: ожсс
    название: Общая железосвязывающая способность
    синонимы: [ОЖСС, Общая железосвязывающая способность сыворотки]
    единицы: мкмоль/л
    лабораторный_интервал: [45.3, 77.1]
