# Общий анализ крови.
#
# Заведено по корпусу выгрузок: название, все встреченные написания,
# единицы и лабораторный интервал с бланка. Целевых коридоров здесь нет
# и заводить их некому, кроме коуча (решение 1 плана): показатель без
# коридора всё равно узнаётся, единицы сверяются, динамика строится, а на
# экране находок он попадает в «нет правила в базе знаний» — то есть в
# рабочий список коридоров, которые предстоит задать.
#
# Лабораторный интервал указан только там, где лаборатории корпуса печатают
# один и тот же. Где интервал зависит от пола (гемоглобин, гематокрит,
# эритроциты) — не указан вовсе: поля «для мужчин» у интервала нет, и один
# из двух был бы неверным для половины клиентов. Где лаборатории расходятся
# без общего большинства — тоже не указан: усреднять в число, которого не
# печатала ни одна лаборатория, нельзя.
#
# Часть написаний единиц — след распознавания, а не бланка: «10%» и «10*⅔»
# получаются из «10⁹» и «10¹²», когда надстрочный знак читается неверно.
# Они объявлены синонимами намеренно: иначе строка отвергается с «единицы
# не сопоставлены», хотя показатель распознан.
#
# Синонимы пишутся с оглядкой на intake/resolve.py: он срезает код
# номенклатуры и скобочные уточнения, а дальше пробует два написания —
# сперва полное, потом обрезанное по первой запятой. Поэтому «Гемоглобин,
# г/л», «Гемоглобин (HGB)» и «Гемоглобин (HGB, Hb)» находятся по одному
# написанию «Гемоглобин», и отдельными синонимами не заводятся.
#
# Лейкоцитарная формула — исключение: там за запятой стоят не единицы, а имя
# самой величины. Одна клеточная линия печатается двумя строками — долей
# («Лимфоциты (LYMPH), %») и абсолютным счётом («Лимфоциты (LYMPH),
# абсолютное количество»; у другой лаборатории те же две величины помечены
# «%» и «#»). Это два показателя в разных единицах, и написание одного
# синонимом другого объявлять нельзя ни в какую сторону: абсолютный счёт
# клиента ушёл бы в отчёт подписанным процентами. Запятая в синонимах не
# пишется — полное написание сравнивается с запятой, замененной пробелом.
#
# «абс.» и «абс» — сознательное исключение из правила «только по корпусу»:
# этого сокращения в сегодняшних 77 файлах нет, а на бланках оно самое
# ходовое написание абсолютного счёта. Без него «Лимфоциты, абс.» не
# находится полным написанием, проваливается в обрезанное по запятой и
# приходит к процентному показателю. Единицы ловят это не всегда: бланк без
# колонки единиц законен, и тогда ловить нечем. Цена промаха здесь не
# «строка не распознана», а абсолютный счёт клиентки, навсегда вставший в её
# динамику под процентами. Обе формы выписаны, хотя после чистки (точка в
# конце срезается) остаётся одна: этот файл читает коуч, и он называет то,
# что она видит на бланке. В процентных показателях этих написаний нет и
# быть не должно — на них держится всё различение двух величин.

показатели:
  - id: гемоглобин
    название: Гемоглобин
    синонимы: [Hb, HGB]
    единицы: г/л

  - id: эритроциты
    название: Эритроциты
    синонимы: [RBC, Общее количество эритроцитов]
    единицы: 10¹²/л
    синонимы_единиц: ["10*12/л", "x10*12/л", "10*12/литр", "10^12/л", "1012/л", "10*⅔"]

  - id: гематокрит
    название: Гематокрит
    синонимы: [Ht, HCT]
    единицы: "%"

  - id: лейкоциты
    название: Лейкоциты
    синонимы: [WBC, Общее количество лейкоцитов]
    единицы: 10⁹/л
    синонимы_единиц: ["10*9/л", "x10*9/л", "10*9/литр", "10^9/л", "109/л", "10%/л", "10%"]

  - id: тромбоциты
    название: Тромбоциты
    синонимы: [PLT]
    единицы: 10⁹/л
    синонимы_единиц: ["10*9/л", "x10*9/л", "10*9/литр", "10^9/л", "109/л", "10%/л", "10%"]

  - id: соэ
    название: СОЭ
    синонимы: [Скорость оседания эритроцитов, ESR]
    единицы: мм/час
    синонимы_единиц: [мм/ч, ми/час]
    лабораторный_интервал: [0, 20]

  - id: лимфоциты
    название: Лимфоциты
    синонимы: [LYMPH, "Лимфоциты %"]
    единицы: "%"

  - id: лимфоциты_абс
    название: Абсолютное содержание лимфоцитов
    синонимы:
      - "Лимфоциты абсолютное количество"
      - "Лимфоциты абс."
      - "Лимфоциты абс"
      - "Лимфоциты #"
    единицы: 10⁹/л
    синонимы_единиц: ["10*9/л", "x10*9/л", "10*9/литр", "10^9/л", "109/л", "10%/л", "10%"]
    лабораторный_интервал: [1.26, 3.35]

  - id: моноциты
    название: Моноциты
    синонимы: [MON, "Моноциты %"]
    единицы: "%"

  - id: моноциты_абс
    название: Абсолютное содержание моноцитов
    синонимы:
      - "Моноциты абсолютное количество"
      - "Моноциты абс."
      - "Моноциты абс"
      - "Моноциты #"
    единицы: 10⁹/л
    синонимы_единиц: ["10*9/л", "x10*9/л", "10*9/литр", "10^9/л", "109/л", "10%/л", "10%"]
    лабораторный_интервал: [0.25, 0.84]

  - id: эозинофилы
    название: Эозинофилы
    синонимы: ["Эозинофилы %"]
    единицы: "%"

  - id: эозинофилы_абс
    название: Абсолютное содержание эозинофилов
    синонимы:
      - "Эозинофилы абсолютное количество"
      - "Эозинофилы абс."
      - "Эозинофилы абс"
      - "Эозинофилы #"
    единицы: 10⁹/л
    синонимы_единиц: ["10*9/л", "x10*9/л", "10*9/литр", "10^9/л", "109/л", "10%/л", "10%"]
    лабораторный_интервал: [0.01, 0.4]

  - id: базофилы
    название: Базофилы
    синонимы: [BA, "Базофилы %"]
    единицы: "%"
    лабораторный_интервал: [0, 1]

  - id: базофилы_абс
    название: Абсолютное содержание базофилов
    синонимы:
      - "Базофилы абсолютное количество"
      - "Базофилы абс."
      - "Базофилы абс"
      - "Базофилы #"
    единицы: 10⁹/л
    синонимы_единиц: ["10*9/л", "x10*9/л", "10*9/литр", "10^9/л", "109/л", "10%/л", "10%"]
    лабораторный_интервал: [0, 0.07]

  - id: нейтрофилы
    название: Нейтрофилы
    синонимы: [NE, "Нейтрофилы %"]
    единицы: "%"

  - id: нейтрофилы_абс
    название: Абсолютное содержание нейтрофилов
    синонимы:
      - "Нейтрофилы абсолютное количество"
      - "Нейтрофилы абс."
      - "Нейтрофилы абс"
      - "Нейтрофилы #"
    единицы: 10⁹/л
    синонимы_единиц: ["10*9/л", "x10*9/л", "10*9/литр", "10^9/л", "109/л", "10%/л", "10%"]
    лабораторный_интервал: [2.1, 8.89]

  - id: нейтрофилы_сегментоядерные
    название: Сегментоядерные нейтрофилы
    синонимы:
      - Нейтрофилы сегментоядерные
      - "Нейтрофилы сегментоядерные %"
      - С/я нейтрофилы
    единицы: "%"

  - id: нейтрофилы_палочкоядерные
    название: Палочкоядерные нейтрофилы
    синонимы: [Нейтрофилы палочкоядерные, П/я нейтрофилы]
    единицы: "%"
    лабораторный_интервал: [1, 5]

  - id: mcv
    название: Средний объём эритроцита
    синонимы:
      - MCV
      - Средний объем эритроцита
      - Средний объем эритроцитов
      - Средний объём эритроцитов
      - Ср. объем эритроцита
    единицы: фл
    синонимы_единиц: [фл.]

  - id: mch
    название: Среднее содержание гемоглобина в эритроците
    синонимы:
      - MCH
      - Среднее содержание Hb в эритроците
      - Среднее содержание гемоглобина в эр
      - Ср. сод. гемоглоб. в эр-те
    единицы: пг
    лабораторный_интервал: [27, 34]

  - id: mchc
    название: Средняя концентрация гемоглобина в эритроцитах
    синонимы:
      - MCHC
      - Средняя концентрация Hb в эритроцитах
      - Средняя концентрация гемоглобина в эр
      - Ср. конц. гемоглоб. в эр-те
    единицы: г/л
    синонимы_единиц: [t/n]
    лабораторный_интервал: [320, 360]

  - id: rdw
    название: Ширина распределения эритроцитов
    синонимы:
      - RDW-CV
      - Распределение эритроцитов по объему
      - Индекс распределения эритроцитов
    единицы: "%"

  - id: mpv
    название: Средний объём тромбоцитов
    синонимы: [MPV, Средний объем тромбоцитов, Ср. объем тромбоцитов]
    единицы: фл
    синонимы_единиц: [фл.]

  - id: тромбокрит
    название: Тромбокрит
    синонимы: [PCT]
    единицы: "%"

  # PDW печатается двумя разными величинами: разбросом в фемтолитрах и
  # коэффициентом вариации в процентах. Это не два написания одного
  # показателя, а два показателя, и объявить проценты синонимом
  # фемтолитров значило бы сравнивать их между собой.
  - id: индекс_распределения_тромбоцитов
    название: Индекс распределения тромбоцитов
    единицы: фл
    синонимы_единиц: [фл.]
    лабораторный_интервал: [10, 18]

  - id: ширина_распределения_тромбоцитов
    название: Ширина распределения тромбоцитов
    единицы: "%"
    лабораторный_интервал: [12, 18]

  - id: плазматические_клетки
    название: Плазматические клетки
    единицы: "%"

  - id: незрелые_гранулоциты
    название: Незрелые гранулоциты
    синонимы:
      - "Незрелые гранулоциты #"
    единицы: 10⁹/л
    синонимы_единиц: ["10*9/л", "x10*9/л", "10*9/литр", "10^9/л", "109/л", "10%/л", "10%"]
    лабораторный_интервал: [0, 0.09]

  - id: незрелые_гранулоциты_процент
    название: Незрелые гранулоциты IG
    синонимы: ["Незрелые гранулоциты %"]
    единицы: "%"
    лабораторный_интервал: [0, 0.5]

  - id: микроциты
    название: Микроциты
    единицы: "%"
    лабораторный_интервал: [0, 15]

  - id: макроциты
    название: Макроциты
    единицы: "%"
    лабораторный_интервал: [0, 15]
