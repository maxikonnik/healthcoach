# Липидный профиль.
#
# Лабораторный интервал не указан ни у одного: в корпусе лаборатории
# печатают в колонке референса не число, а «Смотри текст» — то есть
# отсылку к целевому уровню, который зависит от сердечно-сосудистого
# риска. Переписать сюда одну из отсечек, встреченных в пояснительном
# тексте бланка, значило бы выдать её за лабораторную норму.
#
# Целевых коридоров, как и везде в заведённых по корпусу файлах, нет
# (решение 1 плана).

показатели:
  - id: холестерин_общий
    название: Холестерин общий
    синонимы: [Холестерин, Общий холестерин]
    единицы: ммоль/л

  - id: лпнп
    название: Холестерин-ЛПНП
    синонимы:
      - ЛПНП
      - ЛПНП-холестерин
      - Холестерин липопротеинов низкой плотности
      - LDL
    единицы: ммоль/л

  - id: лпвп
    название: Холестерин-ЛПВП
    синонимы:
      - ЛПВП
      - ЛПВП-холестерин
      - Холестерин липопротеинов высокой плотности
      - HDL
    единицы: ммоль/л

  - id: триглицериды
    название: Триглицериды
    синонимы: [Trig]
    единицы: ммоль/л
