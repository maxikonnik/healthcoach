# Щитовидная железа.
#
# Целевых коридоров нет (решение 1 плана) — здесь это особенно важно:
# «оптимальный» ТТГ у превентивного специалиста уже своего мнения, и
# подставить сюда чужое значило бы выдать его за её.
#
# Свободные Т4 и Т3 корпус печатает в двух системах единиц: нг/дл и пг/мл
# у одних лабораторий, пмоль/л у других. Это не написания одной единицы, а
# разные величины, и синонимами они не объявлены: перевод требует молярной
# массы, а `units_match` не считает. Строка в пмоль/л уходит в «единицы не
# сопоставлены» — коуч видит и показатель, и причину, по которой он не
# сверен.
#
# Интервал у антител не указан: лаборатории корпуса печатают разные
# отсечки (0–34 и <9.0 у АТ-ТПО, 0–115 и <4.1 у АТ-ТГ) — это разные наборы
# реактивов, а не расхождение в округлении.

показатели:
  - id: ттг
    название: ТТГ
    синонимы: [TSH, Тиреотропный гормон]
    единицы: мкМЕ/мл
    синонимы_единиц: [мЕд/л, мМЕ/л]
    лабораторный_интервал: [0.27, 4.2]

  - id: т4_свободный
    название: Т4 свободный
    синонимы: [FT4, Тироксин свободный, Свободный Т4]
    единицы: нг/дл
    лабораторный_интервал: [0.8, 2.1]

  - id: т3_свободный
    название: Т3 свободный
    синонимы: [FT3, Трийодтиронин свободный, Свободный Т3]
    единицы: пг/мл
    лабораторный_интервал: [2.38, 4.37]

  - id: ат_тпо
    название: АТ-ТПО
    синонимы:
      - Антитела к тиреопероксидазе
      - Антитела к тиреопероксидазе Ig G
      - Anti-TPO
    единицы: МЕ/мл

  - id: ат_тг
    название: АТ-ТГ
    синонимы:
      - Антитела к тиреоглобулину
      - Антитела к тиреоглобулину lg G
      - Anti-Tg
    единицы: МЕ/мл
