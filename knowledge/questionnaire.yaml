version: "1.0"
blocks:
  - id: pitanie
    title: "ПИТАНИЕ"
    part: организационная
    core: true
    scale:
      - {score: 0, label: "не употребляю"}
      - {score: 1, label: "употребляю 1-3 раза в месяц"}
      - {score: 2, label: "употребляю 1-3 раза в неделю"}
      - {score: 3, label: "употребляю ежедневно"}
    questions:
      - id: pitanie.а.1
        number: 1
        text: "Искусственные подсластители, сахарозаменители"
      - id: pitanie.а.2
        number: 2
        text: "Конфеты, десерты, сладости, сахар в чистом виде"
      - id: pitanie.а.3
        number: 3
        text: "Батончики «здоровые» (финики, сухофрукты, мед и пр.)"
      - id: pitanie.а.4
        number: 4
        text: "Батончики с молочным протеином"
      - id: pitanie.а.5
        number: 5
        text: "Газированные сладкие напитки"
      - id: pitanie.а.6
        number: 6
        text: "Напитки с кофеином"
      - id: pitanie.а.7
        number: 7
        text: "Фаст-фуд"
      - id: pitanie.а.8
        number: 8
        text: "Жареная пища"
      - id: pitanie.а.9
        number: 9
        text: "Мясные полуфабрикаты"
      - id: pitanie.а.10
        number: 10
        text: "Маргарин (продукты с маргарином)"
      - id: pitanie.а.11
        number: 11
        text: "Молочная продукция"
      - id: pitanie.а.12
        number: 12
        text: "Мучные изделия"
      - id: pitanie.а.13
        number: 13
        text: "Вода неизвестного качества"
      - id: pitanie.а.14
        number: 14
        text: "Дистиллированная вода"
      - id: pitanie.б.1
        number: 1
        text: "Свежие овощи и фрукты"
        scale:
          - {score: 0, label: "употребляю ежедневно"}
          - {score: 1, label: "употребляю 1-3 раза в неделю"}
          - {score: 2, label: "употребляю 1-3 раза в месяц"}
          - {score: 3, label: "не употребляю"}
      - id: pitanie.б.2
        number: 2
        text: "Мясо, птица, рыба и морепродукты"
        scale:
          - {score: 0, label: "употребляю ежедневно"}
          - {score: 1, label: "употребляю 1-3 раза в неделю"}
          - {score: 2, label: "употребляю 1-3 раза в месяц"}
          - {score: 3, label: "не употребляю"}
      - id: pitanie.б.3
        number: 3
        text: "Питьевая вода – фильтрованная и/или вода из стеклянных бутылок"
        scale:
          - {score: 0, label: "употребляю ежедневно"}
          - {score: 1, label: "употребляю 1-3 раза в неделю"}
          - {score: 2, label: "употребляю 1-3 раза в месяц"}
          - {score: 3, label: "не употребляю"}
      - id: pitanie.б.4
        number: 4
        text: "Стараюсь придерживаться принципов правильного питания"
        scale:
          - {score: 0, label: "употребляю ежедневно"}
          - {score: 1, label: "употребляю 1-3 раза в неделю"}
          - {score: 2, label: "употребляю 1-3 раза в месяц"}
          - {score: 3, label: "не употребляю"}
    subscales:
      - id: а
        title: "А. Часть 1"
        question_ids:
          - pitanie.а.1
          - pitanie.а.2
          - pitanie.а.3
          - pitanie.а.4
          - pitanie.а.5
          - pitanie.а.6
          - pitanie.а.7
          - pitanie.а.8
          - pitanie.а.9
          - pitanie.а.10
          - pitanie.а.11
          - pitanie.а.12
          - pitanie.а.13
          - pitanie.а.14
        thresholds:
          - {degree: низкая, min: 4, max: 8, sex: null}
          - {degree: средняя, min: 9, max: 13, sex: null}
          - {degree: высокая, min: 14, max: null, sex: null}
      - id: б
        title: "Б. Часть 2"
        question_ids:
          - pitanie.б.1
          - pitanie.б.2
          - pitanie.б.3
          - pitanie.б.4
        thresholds:
          - {degree: низкая, min: 4, max: 8, sex: null}
          - {degree: средняя, min: 9, max: 13, sex: null}
          - {degree: высокая, min: 14, max: null, sex: null}
