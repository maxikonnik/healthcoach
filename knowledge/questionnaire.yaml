  - id: dass_oprosnik_depressia_trevoznost_stress
    title: "DASS - ОПРОСНИК ДЕПРЕССИЯ, ТРЕВОЖНОСТЬ, СТРЕСС"
    part: дополнительная
    core: false
    scale:
      - {score: 0, label: "не имеет ко мне отношения"}
      - {score: 1, label: "относится ко мне в какой-то степени"}
      - {score: 2, label: "относится ко мне в значительной степени"}
      - {score: 3, label: "применимо ко мне очень часто или большую часть времени"}
    questions:
      - id: dass_oprosnik_depressia_trevoznost_stress.1
        number: 1
        text: "Меня расстраивали довольно банальные вещи"
      - id: dass_oprosnik_depressia_trevoznost_stress.2
        number: 2
        text: "Я чувствовал сухость во рту"
      - id: dass_oprosnik_depressia_trevoznost_stress.3
        number: 3
        text: "Кажется, я вообще не испытывал никаких положительных эмоций"
      - id: dass_oprosnik_depressia_trevoznost_stress.4
        number: 4
        text: "У меня возникло затруднение дыхания (например, чрезмерно учащенное дыхание, одышка при отсутствии физических нагрузок)"
      - id: dass_oprosnik_depressia_trevoznost_stress.5
        number: 5
        text: "Я просто не мог начать что-то делать"
      - id: dass_oprosnik_depressia_trevoznost_stress.6
        number: 6
        text: "Я был склонен чрезмерно реагировать на ситуации"
      - id: dass_oprosnik_depressia_trevoznost_stress.7
        number: 7
        text: "Чувство шаткости, неуверенности (например, ноги подкашиваются)"
      - id: dass_oprosnik_depressia_trevoznost_stress.8
        number: 8
        text: "Мне было трудно расслабиться"
      - id: dass_oprosnik_depressia_trevoznost_stress.9
        number: 9
        text: "Я попадал в ситуации, которые меня сильно тревожили, когда они закончились, я испытал большое облегчение"
      - id: dass_oprosnik_depressia_trevoznost_stress.10
        number: 10
        text: "Я чувствовал, что мне нечего ждать"
      - id: dass_oprosnik_depressia_trevoznost_stress.11
        number: 11
        text: "Я довольно легко расстраивался"
      - id: dass_oprosnik_depressia_trevoznost_stress.12
        number: 12
        text: "Я чувствовал, что трачу много «нервной энергии»"
      - id: dass_oprosnik_depressia_trevoznost_stress.13
        number: 13
        text: "Мне было грустно и тоскливо"
      - id: dass_oprosnik_depressia_trevoznost_stress.14
        number: 14
        text: "Я становился нетерпеливым, когда что-то задерживало меня каким-либо образом (например, лифты, светофоры, меня заставляли ждать)"
      - id: dass_oprosnik_depressia_trevoznost_stress.15
        number: 15
        text: "У меня было чувство слабости, дурноты"
      - id: dass_oprosnik_depressia_trevoznost_stress.16
        number: 16
        text: "Я чувствовал, что потерял интерес практически ко всему"
      - id: dass_oprosnik_depressia_trevoznost_stress.17
        number: 17
        text: "Я чувствовал, что ничего не стою как человек"
      - id: dass_oprosnik_depressia_trevoznost_stress.18
        number: 18
        text: "Я чувствовал себя довольно обидчивым"
      - id: dass_oprosnik_depressia_trevoznost_stress.19
        number: 19
        text: "Я заметно потел (например, руки) при отсутствии высоких температур или физических нагрузок"
      - id: dass_oprosnik_depressia_trevoznost_stress.20
        number: 20
        text: "Мне было страшно без видимой причины"
      - id: dass_oprosnik_depressia_trevoznost_stress.21
        number: 21
        text: "Я чувствовал, что жизнь бесполезна"
      - id: dass_oprosnik_depressia_trevoznost_stress.22
        number: 22
        text: "Мне было трудно успокоиться"
      - id: dass_oprosnik_depressia_trevoznost_stress.23
        number: 23
        text: "У меня были трудности с глотанием"
      - id: dass_oprosnik_depressia_trevoznost_stress.24
        number: 24
        text: "Мне казалось, что я не получаю никакого удовольствия от того, чем занимаюсь"
      - id: dass_oprosnik_depressia_trevoznost_stress.25
        number: 25
        text: "Я ощущал работу своего сердца при отсутствии физических нагрузок (например, ощущение учащения пульса, отсутствие ритма сердца)"
      - id: dass_oprosnik_depressia_trevoznost_stress.26
        number: 26
        text: "Я чувствовал себя подавленным и грустным"
      - id: dass_oprosnik_depressia_trevoznost_stress.27
        number: 27
        text: "Я понял, что был очень раздражительным"
      - id: dass_oprosnik_depressia_trevoznost_stress.28
        number: 28
        text: "Я чувствовал, что близок к панике"
      - id: dass_oprosnik_depressia_trevoznost_stress.29
        number: 29
        text: "Мне было трудно успокоиться после того, как что-то меня расстроило"
      - id: dass_oprosnik_depressia_trevoznost_stress.30
        number: 30
        text: "Я боялся, что меня выбьет из колеи какая-нибудь банальная, но незнакомая задача"
      - id: dass_oprosnik_depressia_trevoznost_stress.31
        number: 31
        text: "Я не мог ни в чем проявлять энтузиазм"
      - id: dass_oprosnik_depressia_trevoznost_stress.32
        number: 32
        text: "Мне было трудно противостоять отвлекающим факторам, когда я был занят делом"
      - id: dass_oprosnik_depressia_trevoznost_stress.33
        number: 33
        text: "Я находился в состоянии нервного напряжения"
      - id: dass_oprosnik_depressia_trevoznost_stress.34
        number: 34
        text: "Я чувствовал себя никчемным"
      - id: dass_oprosnik_depressia_trevoznost_stress.35
        number: 35
        text: "Я был нетерпим ко всему, что мешало мне заниматься тем, чем я занимался"
      - id: dass_oprosnik_depressia_trevoznost_stress.36
        number: 36
        text: "Я испугался"
      - id: dass_oprosnik_depressia_trevoznost_stress.37
        number: 37
        text: "Я не видел ничего в будущем, на которое можно было бы надеяться"
      - id: dass_oprosnik_depressia_trevoznost_stress.38
        number: 38
        text: "Я чувствовал, что жизнь бессмысленна"
      - id: dass_oprosnik_depressia_trevoznost_stress.39
        number: 39
        text: "Я начал волноваться"
      - id: dass_oprosnik_depressia_trevoznost_stress.40
        number: 40
        text: "Меня беспокоили ситуации, в которых я мог запаниковать и выставить себя дураком"
      - id: dass_oprosnik_depressia_trevoznost_stress.41
        number: 41
        text: "У меня возникла дрожь (например, в руках)"
      - id: dass_oprosnik_depressia_trevoznost_stress.42
        number: 42
        text: "Мне было трудно проявить инициативу"
    subscales:
    # DASS: три подшкалы (депрессия, тревожность, стресс) пока не разделены.
    # На скрытом листе «DASS (показатели)» формулы относят каждый вопрос сразу
    # к двум подшкалам из трёх — в каждой оказывается 28 вопросов вместо 14.
    # Пороги подшкал прочитаны и приведены ниже закомментированными; чтобы
    # включить разделение, замените подгруппу «весь» на три подгруппы с их
    # списками вопросов. Правится здесь, без изменений в коде.
    # Депрессия: нормальный 0..9; средний 10..13; умеренный 14..20; тяжелый 21..27; очень тяжелый 28..
    # Стресс: нормальный 0..14; средний 15..18; умеренный 19..25; тяжелый 19..25; очень тяжелый 34..
