  - id: obraz_zizni
    title: "ОБРАЗ ЖИЗНИ"
    part: организационная
    core: true
    scale:
      - {score: 0, label: "Да"}
      - {score: 1, label: "Нет"}
      - {score: 2, label: "Один или два раза в месяц"}
      - {score: 3, label: "Никогда"}
    questions:
      - id: obraz_zizni.1
        number: 1
        text: "Ежедневная утренняя разминка/зарядка"
        scale:
          - {score: 0, label: "Да"}
          - {score: 1, label: "Нет"}
      - id: obraz_zizni.2
        number: 2
        text: "Регулярные занятия спортом"
        scale:
          - {score: 0, label: "Два и больше в неделю"}
          - {score: 1, label: "Один раз в неделю"}
          - {score: 2, label: "Один или два раза в месяц"}
          - {score: 3, label: "Никогда"}
      - id: obraz_zizni.3
        number: 3
        text: "Соблюдение резко ограничительных диет/вегетаринства/веганства"
        scale:
          - {score: 0, label: "Никогда"}
          - {score: 1, label: "Один раз в 3 месяца"}
          - {score: 2, label: "Один раз в полгода"}
          - {score: 3, label: "Постоянно"}
      - id: obraz_zizni.4
        number: 4
        text: "Стабильный сон 7-8 часов в день"
        scale:
          - {score: 0, label: "Да"}
          - {score: 1, label: "Нет"}
      - id: obraz_zizni.5
        number: 5
        text: "Работа более 60 часов в неделю"
        scale:
          - {score: 0, label: "Никогда"}
          - {score: 1, label: "Эпизодически"}
          - {score: 2, label: "Часто"}
          - {score: 3, label: "Постоянно"}
    subscales:
      - id: весь
        title: "Весь блок"
        question_ids:
          - obraz_zizni.1
          - obraz_zizni.2
          - obraz_zizni.3
          - obraz_zizni.4
          - obraz_zizni.5
        thresholds:
          - {degree: высокая, min: 5, max: null, sex: null}
