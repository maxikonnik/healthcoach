      - id: sistemnoe_vospalenie_uroven_okislitelnogo_stressa.б.8
        number: 8
        text: "Артрит (остеоартрит / дегенеративный – износ и старение)"
      - id: sistemnoe_vospalenie_uroven_okislitelnogo_stressa.б.9
        number: 9
        text: "Аутоиммунные заболевания (ревматоидный артрит, волчанка, АИТ)"
      - id: sistemnoe_vospalenie_uroven_okislitelnogo_stressa.б.10
        number: 10
        text: "Колит или воспалительные заболевания кишечника"
      - id: sistemnoe_vospalenie_uroven_okislitelnogo_stressa.б.11
        number: 11
        text: "Синдром раздраженного кишечника (спастическая толстая кишка)"
      - id: sistemnoe_vospalenie_uroven_okislitelnogo_stressa.б.12
        number: 12
        text: "Невриты (воспаления нервов, радикулиты, либо нарушения поведения, аутизм)"
      - id: sistemnoe_vospalenie_uroven_okislitelnogo_stressa.б.13
        number: 13
        text: "Сердечнососудистые заболевания или перенесен инфаркт"
      - id: sistemnoe_vospalenie_uroven_okislitelnogo_stressa.б.14
        number: 14
        text: "Индекс массы тела"
        scale:
          - {score: 0, label: "ниже 25"}
          - {score: 1, label: "выше 25"}
      - id: sistemnoe_vospalenie_uroven_okislitelnogo_stressa.б.15
        number: 15
        text: "В моей семье или у меня были случаи болезней Паркинсона или Альцгеймера"
    subscales:
      - id: а
        title: "А. Часть 1"
        question_ids:
