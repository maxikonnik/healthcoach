  - id: korotkiy_oprosnik_po_ocenke_intoksikacii
    title: "КОРОТКИЙ ОПРОСНИК ПО ОЦЕНКЕ ИНТОКСИКАЦИИ"
    part: дополнительная
    core: false
    scale:
      - {score: 0, label: "нет"}
      - {score: 1, label: "да"}
    questions:
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.1
        number: 1
        text: "У меня есть пищевые аллергии или чувствительность к некоторым продуктам"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.2
        number: 2
        text: "Для меня характерны запоры и стул раз в два дня или реже"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.3
        number: 3
        text: "У меня небольшие по объему мочеиспускания и всего несколько раз в день, моча темная и имеет резкий запах"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.4
        number: 4
        text: "Я практически никогда обильно не покрываюсь потом"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.5
        number: 5
        text: "У меня есть утомляемость/мышечные боли/головные боли"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.6
        number: 6
        text: "У меня есть проблемы с концентрацией внимания и памятью"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.7
        number: 7
        text: "Я быстро устаю"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.8
        number: 8
        text: "Я пью нефильтрованную водопроводную воду или воду из пластиковых бутылок"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.9
        number: 9
        text: "Я сдаю свои вещи в химчистку"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.10
        number: 10
        text: "Я работаю или живу в панельном здании с плохой вентиляцией или не открывающимися окнами"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.11
        number: 11
        text: "Я живу в большом городе или промышленной зоне"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.12
        number: 12
        text: "Я регулярно использую бытовые или садовые химикаты или мой дом проходил обработку против насекомых"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.13
        number: 13
        text: "У меня есть «серебряные» пломбы в зубах (ртутная амальгама)"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.14
        number: 14
        text: "Я ем крупную хищную рыбу чаще, чем раз в неделю"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.15
        number: 15
        text: "Я часто сталкиваюсь с одним из следующих запахов, и он меня раздражает: пары бензина или дизельного топлива, духи, запах новой машины, магазины тканей, химчистка, лак для волос, мыло, бытовая химия, табачный дым, хлорированная вода"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.16
        number: 16
        text: "У меня возникает негативная реакция, когда я употребляю в пищу продукты, содержащие глутамат натрия, а также консерванты; есть реакция на аспартам, красное вино или даже небольшое количество другого алкоголя, на сыр, бананы, шоколад, чеснок, лук"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.17
        number: 17
        text: "Когда я пью напитки с кофеином, я чувствую нервозность, ощущаю усиление боли в мышцах и суставах, или у меня возникают симптомы гипогликемии (тревожность, учащенное сердцебиение, потооделение, головокружение)"
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.18
        number: 18
        text: "Я регулярно принимаю сильнодействующие препараты – против головной боли, изжоги, тошноты, аллергии, диареи, противозачаточные средства, и др."
      - id: korotkiy_oprosnik_po_ocenke_intoksikacii.19
        number: 19
        text: "У меня в анамнезе рак груди, или рак легких от курения, или другие типы рака"
    subscales:
      - id: весь
        title: "Весь блок"
        question_ids:
          - korotkiy_oprosnik_po_ocenke_intoksikacii.1
          - korotkiy_oprosnik_po_ocenke_intoksikacii.2
          - korotkiy_oprosnik_po_ocenke_intoksikacii.3
          - korotkiy_oprosnik_po_ocenke_intoksikacii.4
          - korotkiy_oprosnik_po_ocenke_intoksikacii.5
          - korotkiy_oprosnik_po_ocenke_intoksikacii.6
          - korotkiy_oprosnik_po_ocenke_intoksikacii.7
          - korotkiy_oprosnik_po_ocenke_intoksikacii.8
          - korotkiy_oprosnik_po_ocenke_intoksikacii.9
          - korotkiy_oprosnik_po_ocenke_intoksikacii.10
          - korotkiy_oprosnik_po_ocenke_intoksikacii.11
          - korotkiy_oprosnik_po_ocenke_intoksikacii.12
          - korotkiy_oprosnik_po_ocenke_intoksikacii.13
          - korotkiy_oprosnik_po_ocenke_intoksikacii.14
          - korotkiy_oprosnik_po_ocenke_intoksikacii.15
          - korotkiy_oprosnik_po_ocenke_intoksikacii.16
          - korotkiy_oprosnik_po_ocenke_intoksikacii.17
          - korotkiy_oprosnik_po_ocenke_intoksikacii.18
          - korotkiy_oprosnik_po_ocenke_intoksikacii.19
        thresholds:
          - {degree: высокая, min: 9, max: null, sex: null}
  - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi
    title: "БОЛЬШОЙ ОПРОСНИК ПО ОЦЕНКЕ ИНТОКСИКАЦИИ (QEESI)"
    part: дополнительная
    core: false
    scale:
      - {score: 0, label: "не вызывает проблем"}
      - {score: 5, label: "умеренные симптомы"}
      - {score: 10, label: "симптомы, нарушающие дееспособность"}
    questions:
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.а.1
        number: 1
        text: "Выхлопы дизельного или газового двигателя"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.а.2
        number: 2
        text: "Табачный дым"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.а.3
        number: 3
        text: "Инсектициды"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.а.4
        number: 4
        text: "Бензин (например, на АЗС при заправке бензобака)"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.а.5
        number: 5
        text: "Краски или растворитель для краски"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.а.6
        number: 6
        text: "Чистящие средства, дизенфицирующие средства, отбеливатель, средства для ванных комнат, средства для пола"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.а.7
        number: 7
        text: "Определенные духи, освежители воздуха или другие ароматы"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.а.8
        number: 8
        text: "Свежий гудрон или асфальт"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.а.9
        number: 9
        text: "Лак для ногтей, жидкость для снятия лака или лак для волос"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.а.10
        number: 10
        text: "Новые домашние принадлежности, такие как новое ковровое покрытие, новая пластиковая занавеска для душа или интерьер нового автомобиля"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.б.1
        number: 1
        text: "Хлорированная вопроводная вода"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.б.2
        number: 2
        text: "Определенные продукты, такие как конфеты, пицца, молоко, жирная пища, мясо барбекю, лук, чеснок, острая пища или пищевые добавки, такие как глутамат натрия"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.б.3
        number: 3
        text: "Необычные пристрастия или употребление любой пищи, как если бы вы были зависимы от нее; или плохо себя чувствуете, если пропустите прием пищи"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.б.4
        number: 4
        text: "Плохое самочувствие после еды"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.б.5
        number: 5
        text: "Кофеин (кофе, чай, энергетические напитки, шоколад)"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.б.6
        number: 6
        text: "Чувство недомогания, если вы пьете или едите меньше обычного количества кофе, чая, газированных напитков с кофеином, шоколада или совсем не употребляете его"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.б.7
        number: 7
        text: "Алкогольные напитки в небольшом количестве, например одно пиво или бокал вина"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.б.8
        number: 8
        text: "Ткани, металлические украшения, кремы, косметика или другие предметы, которые касаются вашей кожи"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.б.9
        number: 9
        text: "Непереносимость или аллергические реакции на какие-либо лекарства (такие как антибиотики, анестетики, обезболивающие, рентгеноконтрастные красители, вакцины или противозачаточне таблетки), на импланты, протезы, презервативы, иные медицинские, хирургические или стоматологические материалы или процедуры"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.б.10
        number: 10
        text: "Любые классические аллергические реакции (астма, назальные симптомы, крапивница, анафилаксия или экзема) при воздействии таких аллергенов, как: деревья, травы, пыль, плесень, шерсть животных, укусы насекомых или определенные продукты"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.в.1
        number: 1
        text: "Проблемы с мышцами или суставами, такие как боль, спазмы, скованность или слабость"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.в.2
        number: 2
        text: "Проблемы с жжением или раздражением глаз, проблемы с дыхательными путями или дыханием, такие как, одышка, кашель или наличие большого количества слизи, постназальный дренаж, распираторные инфекции"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.в.3
        number: 3
        text: "Проблемы с сердцем, такие как учащенное или нерегулярное сердцебиение, паузы, дискомфорт в груди"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.в.4
        number: 4
        text: "Проблемы с желудком или пищеварительным трактом, такие как боль или спазмы в животе, вздутие живота или метеоризм, тошнота, диарея, запор"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.в.5
        number: 5
        text: "Трудности с концентрацией внимания или запоминанием вещей, ощущение пространства или трудности с принятием решений"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.в.6
        number: 6
        text: "Проблемы с настроением, такие как чувство напряжения или нервозности, раздражительности, депрессии, приступы плаксивости или ярости или потеря мотивации делать то, что раньше вас интересовало"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.в.7
        number: 7
        text: "Проблемы с равновесиеем или координацией, онемением или покалыванием в конечностях или с фокусировкой зрения"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.в.8
        number: 8
        text: "Проблемы с гловой, такие как головные боли, чувство давления или \"переполненности\" в лице или в голове"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.в.9
        number: 9
        text: "Проблемы с кожей, такие как сыпь, крапивница или сухость кожи"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.в.10
        number: 10
        text: "Проблемы с мочевыводящими путями или гениталиями, такие как боль в области таза, частое или неотложное мочеиспускание (для женщин: дискомфорт или другие проблемы с менструальным циклом)"
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.г.1
        number: 1
        text: "Вы курите табак раз в неделю или чаще"
        scale:
          - {score: 0, label: "нет"}
          - {score: 1, label: "да"}
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.г.2
        number: 2
        text: "Вы употребляете алкоголные напитки, пиво или вино один раз в неделю или чаще"
        scale:
          - {score: 0, label: "нет"}
          - {score: 1, label: "да"}
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.г.3
        number: 3
        text: "Вы употребляете напитки с кофеином один раз в неделю или чаще"
        scale:
          - {score: 0, label: "нет"}
          - {score: 1, label: "да"}
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.г.4
        number: 4
        text: "Используете ли вы регулярно (раз в неделю и чаще) духи, лак дл волос или другие ароматизированные средства личной гигиены"
        scale:
          - {score: 0, label: "нет"}
          - {score: 1, label: "да"}
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.г.5
        number: 5
        text: "Был ли ваш дом или ваше рабочее место обработано от насекомых за последний год"
        scale:
          - {score: 0, label: "нет"}
          - {score: 1, label: "да"}
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.г.6
        number: 6
        text: "На вашей нынешней работы или в вашем хобби вы регулярно (раз в неделю или чаще) подвергаетесь воздействию каких-либо химикатов, дыма или паров"
        scale:
          - {score: 0, label: "нет"}
          - {score: 1, label: "да"}
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.г.7
        number: 7
        text: "Курит ли вы или кто-то в вашем доме, кроме вас самих"
        scale:
          - {score: 0, label: "нет"}
          - {score: 1, label: "да"}
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.г.8
        number: 8
        text: "Испольуется ли у вас дома для приготовления пищи газовая или пропановая плита"
        scale:
          - {score: 0, label: "нет"}
          - {score: 1, label: "да"}
      - id: bolsoy_oprosnik_po_ocenke_intoksikacii_qeesi.г.9
        number: 9
        text: "Используется ли ароматизированный кондиционер для белья для стирки вашей одежды или постельного белья"
        scale:
