  - id: zeludok_i_p_z
    title: "ЖЕЛУДОК и П/Ж"
    part: клиническая
    core: true
    scale:
      - {score: 0, label: "не актуально"}
      - {score: 1, label: "иногда актуально; 1-3 раза в месяц"}
      - {score: 2, label: "средне актуально; 1-3 раза в неделю"}
      - {score: 3, label: "сильно актуально; ежедневно"}
    questions:
      - id: zeludok_i_p_z.1
        number: 1
        text: "Отрыжка вскоре после еды"
      - id: zeludok_i_p_z.2
        number: 2
        text: "Изжога или обратный заброс (рефлюкс) пищи из желудка в пищевод"
      - id: zeludok_i_p_z.3
        number: 3
        text: "Вздутие, тяжесть через час после еды"
      - id: zeludok_i_p_z.4
        number: 4
        text: "Потеря интереса/вкуса к белковой пище"
      - id: zeludok_i_p_z.5
        number: 5
        text: "Ощущение дискомфорта/переполненности желудка после еды"
      - id: zeludok_i_p_z.6
        number: 6
        text: "Состояние \"лучше себя чувстую, если не поем\""
      - id: zeludok_i_p_z.7
        number: 7
        text: "Неприятный привкус во рту"
      - id: zeludok_i_p_z.8
        number: 8
        text: "Несвежее дыхание (галитоз)"
      - id: zeludok_i_p_z.9
        number: 9
        text: "Налёт на языке"
      - id: zeludok_i_p_z.10
        number: 10
        text: "Насыщение малым объемом пищи"
      - id: zeludok_i_p_z.11
        number: 11
        text: "Пропускаю еду / питаюсь с перебоями из-за отсутствия аппетита"
      - id: zeludok_i_p_z.12
        number: 12
        text: "Боль в желудке, жжение и/или ноющая боль через 30 мин -1.5 часа после еды"
      - id: zeludok_i_p_z.13
        number: 13
        text: "Острая или жирная (жареная) пища, шоколад, кофе, алкоголь вызывают жжение или ноющую боль в желудке"
      - id: zeludok_i_p_z.14
        number: 14
        text: "Боли/спазмы/дискомфорт в желудке"
      - id: zeludok_i_p_z.15
        number: 15
        text: "Хрупкие или ломкие ногти"
      - id: zeludok_i_p_z.16
        number: 16
        text: "Анемия, не поддающаяся корректировке препаратми железа"
      - id: zeludok_i_p_z.17
        number: 17
        text: "Опоясывающие боли"
      - id: zeludok_i_p_z.18
        number: 18
        text: "Тошнота/рвота"
      - id: zeludok_i_p_z.19
        number: 19
        text: "Трудность или боль во время проглатывания еды или жидкости"
      - id: zeludok_i_p_z.20
        number: 20
        text: "Чёрный или дёгтеобразный стул"
      - id: zeludok_i_p_z.21
        number: 21
        text: "Непереваренная пища в кале (особенно, наличие мышечных волокон по копрограмме)"
