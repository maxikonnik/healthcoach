<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Health Coaching{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 60rem;
           margin-inline: auto; padding: 1rem 1rem 4rem;
           overflow-wrap: anywhere; }
    a { color: inherit; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid; }
    th { font-weight: 600; opacity: .7; font-size: .85rem; }
    form { margin: 1rem 0; display: flex; gap: .5rem; flex-wrap: wrap;
           align-items: end; }
    label { display: grid; gap: .2rem; font-size: .85rem; opacity: .8; }
    input, select, button { font: inherit; padding: .4rem .5rem; }
    nav { margin-bottom: 1.5rem; font-size: .9rem; }
    .muted { opacity: .6; }
    .warn { color: #b45309; }
    .bad { color: #b91c1c; font-weight: 600; }
    .tag { display:inline-block; font-size:.8rem; padding:0 .5rem; border-radius:9px; margin-right:.25rem; }
    .tag.ok{background:#e8f2e8;color:#2d5a3d}
    .tag.warn{background:#fff3cd;color:#7a5c00}
    .tag.bad{background:#fde8e8;color:#9b1c1c}
    .tag.muted{background:#eee;color:#666}
    .steps { display:flex; gap:.4rem; margin:.8rem 0; }
    .step { flex:1; border:1px solid #ccc; border-radius:5px; padding:.3rem .5rem;
            font-size:.8rem; text-align:center; text-decoration:none; color:inherit; }
    .step.done { background:#e8f2e8; border-color:#9c9; }
    .step.part { background:#fff3cd; border-color:#dcb; }
    progress { width: 100%; max-width: 30rem; height: 1rem; }
    #draft-status { margin: 1rem 0; }
    #draft-status p { margin: .35rem 0; }
    .finding { margin-bottom: 1.5rem; }
    .finding h3 { font-size: 1.1rem; margin-top: 0; }
    .scale { position: relative; height: .5rem; background: #eee; border-radius: 3px; }
    .scale-target { position: absolute; top: 0; bottom: 0; background: #e8f2e8; border: 1px solid #9c9; }
    .scale-mark { position: absolute; top: -.2rem; bottom: -.2rem; width: 2px;
                  background: #333; transform: translateX(-50%); }
    /* Значение вне оси — треугольная стрелка за краем полосы, а не риска
       другого цвета: цветом на этом экране закодирована тяжесть статуса,
       и красная риска читалась бы как «значение плохое», тогда как речь о
       другом — «шкала его не показывает, оно дальше края». Форма отличает
       её от риски внутри полосы с любого расстояния. */
    .scale-mark.outside { width: 0; height: 0; background: none;
                          top: 50%; bottom: auto;
                          border-top: .35rem solid transparent;
                          border-bottom: .35rem solid transparent; }
    .scale-mark.outside.to-left { border-right: .45rem solid #b91c1c;
                                  transform: translate(-100%, -50%); }
    .scale-mark.outside.to-right { border-left: .45rem solid #b91c1c;
                                   transform: translateY(-50%); }
    .scale-ends { display: flex; justify-content: space-between; font-size: .75rem; opacity: .6; }
    /* Страница объявляет color-scheme: light dark, значит холст под ней
       бывает тёмным. Светлые цвета шкалы на нём превращают полосу в яркий
       остров, а вылет маркера за её края — то, ради чего его и видно, —
       красят тёмным по тёмному. Только новые классы шкалы: тёмная схема
       .tag и .step жила без неё и до этого экрана — это отдельный вопрос,
       и чинить его заодно значит смешать две правки в одной. */
    @media (prefers-color-scheme: dark) {
      .scale { background: #333; }
      .scale-target { background: #22331f; border-color: #4c7a4c; }
      .scale-mark { background: #ddd; }
      .scale-mark.outside.to-left { border-right-color: #f87171; }
      .scale-mark.outside.to-right { border-left-color: #f87171; }
    }
  </style>
</head>
<body>
  <nav><a href="/">← Клиенты</a></nav>
  {% block body %}{% endblock %}
</body>
</html>
