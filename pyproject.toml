[project]
name = "healthcoach"
version = "0.1.0"
description = "Локальный инструмент health coaching специалиста"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
    "pdfplumber>=0.11",
    "weasyprint>=62",
    "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Живой вызов модели не входит в обычный прогон: на машине коуча `claude`
# установлен и авторизован, поэтому без этой строки каждый `uv run pytest`
# молча тратил бы лимиты его подписки. Регистрация маркера в conftest сама
# по себе ничего не отбирает — отбирает вот это.
#
# `--import-mode=importlib` — иначе `tests/report/test_pdf.py` и уже
# существующий `tests/intake/test_pdf.py` конфликтуют по имени модуля:
# в каталогах тестов нет `__init__.py`, и pytest по умолчанию регистрирует
# оба файла под одним и тем же именем `test_pdf` в sys.modules.
addopts = "-m 'not llm' --import-mode=importlib"
