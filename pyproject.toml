[project]
name = "healthcoach"
version = "0.1.0"
description = "Локальный инструмент health coaching специалиста"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
